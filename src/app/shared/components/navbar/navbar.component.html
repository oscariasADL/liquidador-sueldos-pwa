<nav class="navbar">
  <div class="navbar__container">
    <a class="navbar__brand" [routerLink]="homeRoute()" (click)="closeMenu()">
      <span class="navbar__logo" aria-hidden="true">◈</span>
      <span class="navbar__titles">
        <span class="navbar__title">OrigamiApp</span>
        <span class="navbar__role">{{ roleLabel() }}</span>
      </span>
    </a>

    <button
      class="navbar__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú de navegación' : 'Abrir menú de navegación'"
    >
      <span class="navbar__toggle-line" [class.active]="menuOpen()"></span>
      <span class="navbar__toggle-line" [class.active]="menuOpen()"></span>
      <span class="navbar__toggle-line" [class.active]="menuOpen()"></span>
    </button>

    <div class="navbar__menu" [class.open]="menuOpen()">
      <ul class="navbar__links">
        @for (item of navItems(); track item.path) {
          <li>
            <a
              class="navbar__link"
              [routerLink]="item.path"
              routerLinkActive="active"
              (click)="closeMenu()"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>

      <button class="navbar__logout" type="button" (click)="logout()">
        Cerrar sesión
      </button>
    </div>
  </div>
</nav>
